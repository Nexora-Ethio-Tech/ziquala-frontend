<!doctype html>
<html lang="en" class="dark" data-theme="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme = 'dark';
        try {
          const saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch {}
        const root = document.documentElement;
        root.classList.toggle('dark', theme === 'dark');
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        let language = 'en';
        try { language = localStorage.getItem('ziquala_language') || localStorage.getItem('ziquala_lang') || 'en'; } catch {}
        root.dataset.lang = language === 'am' ? 'am' : language === 'om' || language === 'or' ? 'om' : 'en';
        root.lang = root.dataset.lang;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Use the local academic serif stack: no font download or late font swap. -->
    <meta name="description" content="Ziquala Abo School — academic excellence, spiritual wisdom, and responsible citizenship." />
    <meta name="theme-color" content="#075b42" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Ziquala Abo School</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
